# List of ComfyUI extensions to install.
# Each entry only needs a Git URL.
extensions:

# General
  - url: https://github.com/Comfy-Org/ComfyUI-Manager.git                        # ComfyUI Manager
  - url: https://github.com/ty0x2333/ComfyUI-Dev-Utils.git                       # ComfyUI Dev Utils (Execution Time Analysis)
  - url: https://github.com/rgthree/rgthree-comfy.git                            # Utility nodes like Seed, Image Compare, Group Bypass, ...
  - url: https://github.com/StableLlama/ComfyUI-basic_data_handling.git          # Type handling, math operations, ..
  - url: https://github.com/Tropfchen/ComfyUI-yaResolutionSelector.git           # Resolution selector
  - url: https://github.com/yolain/ComfyUI-Easy-Use.git                          # Utility Nodes like Clear Cache
  - url: https://github.com/shiimizu/ComfyUI-TiledDiffusion.git                  # Tiled Diffusion (Upscale)
  - url: https://github.com/kijai/ComfyUI-Florence2.git                          # Florence 2 (captions, masking, ...)

# Preprocessor / Segmentation / WAN Animate
  - url: https://github.com/Fannovel16/comfyui_controlnet_aux.git                # Control Net Preprocessors
  - url: https://github.com/kijai/ComfyUI-segment-anything-2.git                 # Mask Segmentation
  - url: https://github.com/kijai/ComfyUI-KJNodes                                # Various Quality of Life and maksing nodes

# Image
  - url: https://github.com/ssitu/ComfyUI_UltimateSDUpscale.git                  # Ultimate SD Upscale
  - url: https://github.com/ialhabbal/PhotoLab.git                               # Quick Color Grading
  - url: https://github.com/okdalto/ComfyUI-Color-Matcher.git                    # Color Matching
  - url: https://github.com/tritant/ComfyUI-Advanced-Photo-Grain.git             # Photo Grain Sharpen
  - url: https://github.com/chflame163/ComfyUI_LayerStyle.git                    # Color Tools like Auto-Brightness
  - url: https://github.com/AHEKOT/ComfyUI_VNCCS_Utils.git                       # QWEN Multiple Angle and Refinement nodes

# Video
  - url: https://github.com/Kosinkadink/ComfyUI-VideoHelperSuite.git   # Advanced load/save video nodes
  - url: https://github.com/Fannovel16/ComfyUI-Frame-Interpolation.git # RIFE frame interpolation
# - url: https://github.com/lihaoyun6/ComfyUI-FlashVSR_Ultra_Fast      # FlashVSR Video Upscale
  - url: https://github.com/numz/ComfyUI-SeedVR2_VideoUpscaler.git     # SeedVR2 Video Upscale

# Audio
  - url: https://github.com/kijai/ComfyUI-MMAudio.git # Video-to-Audio 